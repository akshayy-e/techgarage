spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
logging.level.com.techgarage=INFO
app.seed.enabled=false
app.jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

app.frontend-url=${FRONTEND_URL}
app.auth.require-email-verification=${REQUIRE_EMAIL_VERIFICATION:true}
app.mail.enabled=${MAIL_ENABLED:true}
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM}

# Payment secrets MUST be supplied as environment variables in production.
app.payment.enabled=${RAZORPAY_ENABLED:false}
app.payment.key-id=${RAZORPAY_KEY_ID:}
app.payment.key-secret=${RAZORPAY_KEY_SECRET:}
app.payment.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
app.payment.platform-fee-percent=${PLATFORM_FEE_PERCENT:10.0}

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:5000}

# Production upload limits (also enforced by FileStorageServiceImpl)
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:25MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:25MB}
spring.jpa.open-in-view=false
