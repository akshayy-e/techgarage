spring.application.name=techgarage-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

server.port=${SERVER_PORT:8080}

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:25MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:25MB}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.ai.enabled=${AI_FEATURES_ENABLED:true}
app.ai.anthropic-api-key=${ANTHROPIC_API_KEY:}
app.ai.anthropic-model=${ANTHROPIC_MODEL:claude-haiku-4-5-20251001}

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.auth.require-email-verification=${REQUIRE_EMAIL_VERIFICATION:false}
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:noreply@techgarage.local}

# Online payments (Razorpay). Keep secrets in environment variables in production.
app.payment.enabled=${RAZORPAY_ENABLED:false}
app.payment.key-id=${RAZORPAY_KEY_ID:}
app.payment.key-secret=${RAZORPAY_KEY_SECRET:}
app.payment.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
app.payment.platform-fee-percent=${PLATFORM_FEE_PERCENT:10.0}

# Database migrations
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:3}
spring.flyway.validate-on-migrate=true

# Observability
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true

# Notification streaming
app.notifications.sse-timeout-ms=${NOTIFICATION_SSE_TIMEOUT_MS:1800000}


# ===============================
# Development Email Configuration
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false