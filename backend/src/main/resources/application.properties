spring.application.name=techgarage-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=${PORT:8080}

# JWT
app.jwt.secret=${JWT_SECRET:techgarage-dev-secret-key-change-me-please-1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# File uploads
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# AI
app.ai.enabled=${AI_FEATURES_ENABLED:true}
app.ai.anthropic-api-key=${ANTHROPIC_API_KEY:}
app.ai.anthropic-model=${ANTHROPIC_MODEL:claude-haiku-4-5-20251001}