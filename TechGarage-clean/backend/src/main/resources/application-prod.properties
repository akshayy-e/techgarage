# =========================================================
# DATABASE
# =========================================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Hibernate performance
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true


# =========================================================
# HIKARI CONNECTION POOL
# =========================================================

spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:12}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:3}

spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:5000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:2000}

spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}

spring.datasource.hikari.pool-name=TechGarageHikariPool


# =========================================================
# LOGGING
# =========================================================

logging.level.com.techgarage=INFO


# =========================================================
# APPLICATION
# =========================================================

app.seed.enabled=false

app.frontend-url=${FRONTEND_URL}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}


# =========================================================
# JWT
# =========================================================

app.jwt.secret=${JWT_SECRET}


# =========================================================
# EMAIL
# =========================================================

app.mail.enabled=${MAIL_ENABLED:true}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${MAIL_FROM}


# =========================================================
# RAZORPAY
# =========================================================

app.payment.enabled=${RAZORPAY_ENABLED:false}

app.payment.key-id=${RAZORPAY_KEY_ID:}
app.payment.key-secret=${RAZORPAY_KEY_SECRET:}
app.payment.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

app.payment.platform-fee-percent=${PLATFORM_FEE_PERCENT:10.0}


# =========================================================
# FILE UPLOAD
# =========================================================

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:25MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:25MB}


# =========================================================
# SERVER PERFORMANCE
# =========================================================

server.compression.enabled=true

server.compression.mime-types=application/json,application/javascript,text/css,text/html,text/plain,image/svg+xml

server.compression.min-response-size=1024

server.http2.enabled=true